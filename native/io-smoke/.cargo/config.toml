# Editor source navigation; hyper-cargo uses the installed Native SDK at build time.
[build]
target = "../../../target/sdk/aarch64/share/hyper/targets/aarch64-unknown-hyper.json"

[patch.crates-io]
hyper-abi = { path = "../../../sdk/abi" }
hyper-os = { path = "../../../stdlib/rust/hyper-os" }
hyper-rt = { path = "../../../stdlib/rust/hyper-rt" }
hyper-sys = { path = "../../../stdlib/rust/hyper-sys" }
hyper-filesystem = { path = "../../../stdlib/rust/hyper-filesystem" }

[env]
HYPER_LINK_MODE = "static"
