bin = [{name = "hyper-fs-worker-probe", path = "src/main.rs", test = false, bench = false}]

[package]
name = "hyper-fs-worker-probe"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false
repository = "https://github.com/HypeR-Proj/ci"
workspace = "../../../app"

[dependencies]

[dependencies.hyper-os]
workspace = true

[dependencies.hyper-rt]
workspace = true
features = ["std"]

[dependencies.hyper-filesystem]
workspace = true

[dependencies.hyper-fs-service]
workspace = true

[dependencies.hyper-service]
workspace = true

[lints]

[lints.clippy]
doc_markdown = "deny"
empty_docs = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"
unreachable = "deny"
unwrap_used = "deny"
missing_safety_doc = "deny"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ["cfg(target_os, values(\"hyper\"))"]
